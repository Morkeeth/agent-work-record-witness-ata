# Agent-memory exam — report-only until instruction rot is ruled clean.
name: helicon-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  agent-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mountain of Helicon
        run: python -m pip install mountain-of-helicon
      - name: Run agent-memory exam (report-only)
        run: helicon ci --path . --fail-on none
