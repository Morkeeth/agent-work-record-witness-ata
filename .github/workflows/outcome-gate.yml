name: HOLD Outcome Clearance
# Advisory clearance check for agent-authored PRs (branch protection off). Probes claims against the repo object,
# then posts the decision to the Witness gateway for the org record.
#
# This repo dogfoods its own composite action. A customer installs the same twelve
# lines and points `uses:` at Morkeeth/agent-work-record-witness-ata@main — nothing to vendor.
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  verify-claims:
    permissions:
      checks: write
      contents: read
      pull-requests: read
    if: >
      contains(join(github.event.pull_request.labels.*.name, ','), 'agent')
      || contains(github.event.pull_request.user.login, '[bot]')
      || contains(github.event.pull_request.user.login, 'copilot')
      || contains(github.event.pull_request.user.login, 'claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the SHA probe needs history, not a shallow tip

      - uses: ./                  # this repo IS the action; customers use Morkeeth/agent-work-record-witness-ata@main
        with:
          pr-body: ${{ github.event.pull_request.body }}
          policy-url: ${{ vars.HOLD_POLICY_URL }}
          api-token: ${{ secrets.HOLD_API_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          actor: ${{ github.event.pull_request.user.login }}
          head-sha: ${{ github.event.pull_request.head.sha }}
