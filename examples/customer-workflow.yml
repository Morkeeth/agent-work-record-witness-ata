# Install the Agent Work Record Witness in YOUR repo.
#
# 1. Save this as .github/workflows/agent-clearance.yml
# 2. Repository variable  HOLD_POLICY_URL  = your gateway base URL (omit to run the
#    probe locally and record nothing)
# 3. Repository secret    HOLD_API_TOKEN   = your gateway token
# 4. Settings > Branches > require the "verify-claims" check
#
# Nothing is vendored. The gate ships with the action.
#
# TRACEABILITY: the gateway recovers the session from the PR body itself — a
# claude.ai/code/session_... URL or a "Claude-Session: <id>" line. If neither is
# present the decision is recorded as untraceable and the CI log says so. No id is
# ever invented.
name: Agent claim clearance

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  verify-claims:
    # Only agent-authored PRs. Widen or narrow to match how your org labels them.
    if: >
      contains(join(github.event.pull_request.labels.*.name, ','), 'agent')
      || contains(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Morkeeth/hack-fleet-ata@main
        with:
          pr-body: ${{ github.event.pull_request.body }}
          policy-url: ${{ vars.HOLD_POLICY_URL }}
          api-token: ${{ secrets.HOLD_API_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
